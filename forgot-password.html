<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SCHOOL NAME</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-red: #CE1126;
            --primary-gold: #F5B81B;
            --primary-green: #006B3F;
            --dark-bg: #1a1a1a;
            --light-bg: #f8f9fa;
        }

        body {
            background: linear-gradient(135deg, rgba(206,17,38,0.05) 0%, rgba(0,107,63,0.05) 100%), #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* Abstract Background Shapes */
        .shape-1 {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-green), #10b981);
            opacity: 0.1;
            z-index: 0;
            animation: float 10s ease-in-out infinite;
        }

        .shape-2 {
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-green), #10b981);
            opacity: 0.1;
            z-index: 0;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.8);
            overflow: hidden;
            z-index: 10;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-header {
            background: linear-gradient(135deg, var(--primary-green), #0a5231);
            padding: 35px 30px 25px;
            color: white;
            text-align: center;
        }

        .school-logo {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .school-logo i {
            font-size: 35px;
            color: var(--primary-green);
        }

        .btn-custom {
            background: linear-gradient(135deg, var(--primary-green), #0a5231);
            color: white;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 107, 63, 0.2);
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 107, 63, 0.35);
            color: white;
        }

        .input-group {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(0, 107, 63, 0.15);
            background: #ffffff;
        }

        .input-group-text {
            background: transparent !important;
            border: none !important;
            color: #64748b !important;
            padding-left: 15px;
            padding-right: 5px;
        }

        .form-control {
            background: transparent !important;
            border: none !important;
            padding: 12px 10px;
            font-size: 15px;
            color: #1e293b;
        }

        .back-link {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #0a5231;
            text-decoration: underline;
        }

        .school-badge-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(245, 184, 27, 0.15) 0%, rgba(245, 184, 27, 0.05) 100%);
            border: 1px solid rgba(245, 184, 27, 0.4);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #F5B81B;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(245, 184, 27, 0.15);
            animation: pulseGlow 3s infinite alternate ease-in-out, badgeSlideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(5px);
            text-transform: uppercase;
        }

        .school-badge-container i {
            margin-right: 8px;
            font-size: 13px;
            color: #F5B81B;
            animation: spinnerSlow 8s linear infinite;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 5px rgba(245, 184, 27, 0.1), inset 0 0 5px rgba(245, 184, 27, 0.05);
                border-color: rgba(245, 184, 27, 0.3);
            }
            100% {
                box-shadow: 0 0 15px rgba(245, 184, 27, 0.25), inset 0 0 10px rgba(245, 184, 27, 0.1);
                border-color: rgba(245, 184, 27, 0.6);
            }
        }

        @keyframes badgeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes spinnerSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Background Shapes -->
    <div class="shape-1"></div>
    <div class="shape-2"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="login-card fade-in">
                    <!-- Header -->
                    <div class="brand-header">
                        <div class="school-logo">
                            <i class="fas fa-graduation-cap"></i>
                        </div>
                        <div class="school-badge-container" style="margin-top: 0; margin-bottom: 10px;">
                            <i class="fas fa-certificate"></i> <span class="school-name-text" style="opacity: 0; transition: opacity 0.3s ease;">SERGIO ACADEMY</span>
                        </div>
                        <p class="mb-0 small">Secure Password Recovery</p>
                    </div>

                    <!-- Form Area -->
                    <div class="p-4 p-md-5">
                        <div id="alertMessage"></div>

                        <div class="text-center mb-4">
                            <div class="mb-3">
                                <i class="fas fa-lock fa-3x text-dark opacity-50"></i>
                            </div>
                            <h4 class="fw-bold">Forgot Password?</h4>
                            <p class="text-dark small">No worries! Enter your registered staff email and we will send you a secure link to reset your password.</p>
                        </div>

                        <form id="resetForm">
                            <!-- Email Input -->
                            <div class="mb-4">
                                <label class="form-label text-dark small fw-bold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control" id="resetEmail" required placeholder="Enter your staff email">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-custom w-100 mb-4" id="resetBtn">
                                Send Reset Link <i class="fas fa-paper-plane ms-2"></i>
                            </button>

                            <div class="text-center">
                                <a href="login.html" class="back-link">
                                    <i class="fas fa-arrow-left me-1"></i> Back to Login
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Footer branding -->
                <div class="text-center mt-4 text-dark small fade-in" style="opacity: 1;">
                    Powered by StackWeb Developers
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    
    <script>
        function showAlert(message, type = 'success') {
            const alertDiv = document.getElementById('alertMessage');
            if (alertDiv) {
                alertDiv.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
            }
        }

        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            
            const btn = document.getElementById('resetBtn');
            const email = document.getElementById('resetEmail').value.trim();

            if (!email) {
                showAlert('Please enter your email address.', 'danger');
                return;
            }

            // Loading state
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';
            btn.disabled = true;

            try {
                // Call Supabase to send a password reset code
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });

                if (error) {
                    throw error;
                }

                showAlert(`Success! We've sent password reset instructions to <strong>${email}</strong>.`, 'success');
                this.reset();
            } catch (error) {
                showAlert(`Error: ${error.message}`, 'danger');
            } finally {
                btn.innerHTML = 'Send Reset Link <i class="fas fa-paper-plane ms-2"></i>';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
